name: Smoke real Grype and Syft downloads
on:
  workflow_dispatch:
    inputs:
      grypeVersion:
        description: 'Versão estável do Grype, ex. 0.122.1 ou latest'
        default: 'latest'
        required: true
        type: string
      syftVersion:
        description: 'Versão estável do Syft, ex. 1.57.2 ou latest'
        default: 'latest'
        required: true
        type: string
      fullScan:
        description: 'Baixar banco Grype e analisar SBOM gerada pelo Syft (Linux)'
        default: true
        required: true
        type: boolean
permissions:
  contents: read
jobs:
  smoke:
    name: Real releases (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Test real installs and optional SBOM scan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ${{ inputs.grypeVersion }}_REQUESTED: ${{ inputs.grypeVersion }}
          ${{ inputs.syftVersion }}_REQUESTED: ${{ inputs.syftVersion }}
          SMOKE_FULL_SCAN: ${{ inputs.fullScan && matrix.os == 'ubuntu-latest' }}
        run: node tools/smoke-real.js
