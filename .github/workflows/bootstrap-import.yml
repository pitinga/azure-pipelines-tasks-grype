name: Import Grype 0.1.0 source
on:
  push:
    paths:
      - '.github/workflows/bootstrap-import.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify source bundle and materialize all files
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path, PurePosixPath
          import base64, zlib, hashlib, json
          parts = [Path('.bootstrap') / ('chunk%02d.b64' % n) for n in range(1, 7)]
          data = ''.join(p.read_text('ascii').strip() for p in parts)
          assert len(data) == 41108, 'Missing source archive chunks'
          assert hashlib.sha256(data.encode('ascii')).hexdigest() == '7a4f81619bd944ade62ad5d6af50ee25e0ad703ada56d7865baf1525ab9b7c42', 'Source payload modified'
          raw = zlib.decompress(base64.b64decode(data, validate=True))
          assert hashlib.sha256(raw).hexdigest() == '891c5e31e4fff11f880b5bf2c165e9cc62f29bbf2cb07c0851ed64a2f37f49d3', 'Source checksum mismatch'
          obj = json.loads(raw)
          assert len(obj) == 31, 'Unexpected file count'
          for rel, item in obj.items():
              pp = PurePosixPath(rel)
              assert not pp.is_absolute() and '..' not in pp.parts and not rel.startswith('.github/workflows/') and not rel.startswith('.bootstrap/')
              dest = Path(rel)
              dest.parent.mkdir(parents=True, exist_ok=True)
              if 'b64' in item:
                  dest.write_bytes(base64.b64decode(item['b64'], validate=True))
              elif 'text' in item:
                  dest.write_text(item['text'], encoding='utf-8', newline='')
              else:
                  raise ValueError('Bad entry ' + rel)
          print('Source archive verified; restored', len(obj), 'project files')
          PY
      - name: Run Node24 project checks
        run: npm run check
      - name: Package official VSIX
        run: npm run package:vsix
      - name: Verify official VSIX
        run: npm run verify:vsix
      - name: Commit imported project to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r .bootstrap
          git add -A
          git diff --cached --check
          git commit -m "feat: import Grype and Syft Azure Pipelines tasks 0.1.0"
          git push origin HEAD:main
      - name: Upload official VSIX
        uses: actions/upload-artifact@v7
        with:
          name: grype-syft-vsix-initial
          path: dist/*.vsix
          if-no-files-found: error
          retention-days: 90
      - name: Dispatch multiplatform validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run validate-and-package.yml --ref main
